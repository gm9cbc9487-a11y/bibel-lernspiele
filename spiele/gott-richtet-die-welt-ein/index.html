/* Layout: zentrierte Bühne (max. 880px) – Kopf mit Stationen-Leiste, eine Inhaltskarte im Sticker-Look, Fusszeile.
   Farb-Tokens aus der Bibelwelt (See, Olive, Ocker, Granat, Purpur, Papyrus). Nicht verändern. */
:root{
  --see:#1F6F8B; --see-tief:#155368; --see-hell:#D6EBF1;
  --olive:#4F7A28; --olive-tief:#3A5C1C; --olive-hell:#E2EED5;
  --ocker:#C98A1C; --ocker-tief:#9C6A10; --ocker-hell:#F8ECCF;
  --granat:#B23A48; --granat-hell:#F7DEE1;
  --purpur:#6B3F8F; --purpur-hell:#EDE3F5;
  --papyrus:#FFFAF0; --grund:#E6F0EE; --flaeche:#FFFFFF;
  --tinte:#1E2433; --tinte-2:#4A5468; --akzent-text:#155368;
  --linie:#C9D8D4; --kante:#B4C6C1; --auf-farbe:#FFFFFF; --ocker-text:#8A5E0E;
  --f-titel:"Fredoka","Nunito",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --f-text:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:22px; --r-k:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --see:#67B7D1; --see-tief:#3B8BA6; --see-hell:#1D3742;
    --olive:#9CC26A; --olive-tief:#6E9440; --olive-hell:#24331A;
    --ocker:#F0BE5C; --ocker-tief:#BF8E2E; --ocker-hell:#382D16;
    --granat:#F08A96; --granat-hell:#3D1F26;
    --purpur:#C29BE3; --purpur-hell:#2D2340;
    --papyrus:#262B38; --grund:#161A24; --flaeche:#1E2330;
    --tinte:#EEF1F6; --tinte-2:#B7C0D0; --akzent-text:#8FD0E4;
    --linie:#3A4256; --kante:#0E1118; --auf-farbe:#10141C; --ocker-text:#F0BE5C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --see:#67B7D1; --see-tief:#3B8BA6; --see-hell:#1D3742;
  --olive:#9CC26A; --olive-tief:#6E9440; --olive-hell:#24331A;
  --ocker:#F0BE5C; --ocker-tief:#BF8E2E; --ocker-hell:#382D16;
  --granat:#F08A96; --granat-hell:#3D1F26;
  --purpur:#C29BE3; --purpur-hell:#2D2340;
  --papyrus:#262B38; --grund:#161A24; --flaeche:#1E2330;
  --tinte:#EEF1F6; --tinte-2:#B7C0D0; --akzent-text:#8FD0E4;
  --linie:#3A4256; --kante:#0E1118; --auf-farbe:#10141C; --ocker-text:#F0BE5C;
  color-scheme:dark;
}

/* ===== Grundgerüst – gleich in jedem Spiel ===== */
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--grund);color:var(--tinte);font-family:var(--f-text);font-size:1.15rem;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.app{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-titel);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6.5vw,2.9rem)}
h2{font-size:clamp(1.5rem,4.6vw,2rem)}
h3{font-size:1.25rem}
p{margin:0}
[tabindex="-1"]:focus{outline:none}
:focus-visible{outline:4px solid var(--ocker);outline-offset:3px;border-radius:10px}
svg{display:block}

.kopf{display:flex;align-items:center;justify-content:space-between;gap:12px}
.marke{display:flex;align-items:center;gap:8px;font-family:var(--f-titel);font-weight:600;font-size:1.1rem;color:var(--akzent-text);min-width:0}
.marke .pipo-mini{width:36px;height:36px;flex:none}
.mini-knopf{appearance:none;min-height:44px;padding:0 14px;border-radius:12px;border:3px solid var(--linie);background:var(--papyrus);color:var(--tinte);
  font:600 1rem/1 var(--f-titel);cursor:pointer;display:inline-flex;align-items:center;gap:8px;touch-action:manipulation}
.mini-knopf svg{width:20px;height:20px}

.stationen{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.stationen li{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:800;color:var(--tinte-2);text-align:center;min-width:0}
.stationen .punkt{height:10px;border-radius:99px;background:var(--linie)}
.stationen li.fertig .punkt{background:var(--olive)}
.stationen li.ist .punkt{background:var(--ocker)}
.stationen li.ist{color:var(--tinte)}
.station-text{display:none;font-weight:800;font-size:.95rem;color:var(--tinte-2);margin-top:6px}
@media (max-width:560px){.stationen .name{display:none}.station-text{display:block}}

.karte{background:var(--papyrus);border:3px solid var(--linie);border-radius:var(--r);box-shadow:0 5px 0 var(--kante);
  padding:clamp(16px,4vw,30px);display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-family:var(--f-titel);font-weight:600;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ocker-text)}
.unter{font-size:1.25rem;color:var(--tinte-2);font-weight:800}
.zaehler{font-weight:800;color:var(--tinte-2);font-size:.95rem}
.stelle{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:5px 12px;border-radius:99px;background:var(--see-hell);color:var(--akzent-text);font-weight:800;font-size:.95rem}
.stelle svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:99px;border:2px solid var(--linie);font-weight:800;font-size:.95rem;color:var(--tinte-2)}
.reihe{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.reihe.ende{justify-content:flex-end}
.reihe.zwischen{justify-content:space-between}

.knopf{appearance:none;border:0;border-radius:var(--r-k);background:var(--see);color:var(--auf-farbe);font:600 1.2rem/1 var(--f-titel);
  min-height:56px;padding:0 24px;cursor:pointer;box-shadow:0 5px 0 var(--see-tief);transition:transform .08s,box-shadow .08s;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;touch-action:manipulation}
.knopf svg{width:22px;height:22px}
.knopf:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--see-tief)}
.knopf.zweit{background:var(--flaeche);color:var(--tinte);border:3px solid var(--linie);box-shadow:0 5px 0 var(--kante)}
.knopf.gruen{background:var(--olive);box-shadow:0 5px 0 var(--olive-tief)}
.knopf:disabled{opacity:.45;cursor:default}

/* Pipo, der Spatz */
.pipo{display:flex;align-items:flex-end;gap:10px}
.pipo .pipo-bild{width:76px;height:76px;flex:none}
.pipo .pipo-bild svg{width:100%;height:100%;overflow:visible}
.blase{position:relative;background:var(--flaeche);border:3px solid var(--linie);border-radius:18px 18px 18px 6px;padding:10px 14px;font-weight:800;min-width:0}
.pipo .koerper{animation:wippen 2.6s ease-in-out infinite;transform-origin:50% 90%;transform-box:fill-box}
.pipo.jubelt .koerper{animation:huepfen .5s ease-in-out 3}
.pipo.troestet .blase{border-color:var(--ocker)}
.pipo.jubelt .blase{border-color:var(--olive)}
@keyframes wippen{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes huepfen{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
@keyframes wackeln{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Bilder */
.bild{width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--see-hell)}
.bild svg{width:100%;height:100%}
.start-bild{width:100%;aspect-ratio:32/12;border-radius:16px;overflow:hidden;background:var(--see-hell)}
.start-bild svg{width:100%;height:100%}
.erzaehl{display:grid;gap:18px}
.erzaehl-text{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:720px){.erzaehl{grid-template-columns:1.05fr 1fr;align-items:start}}

/* Baustein: Ordnen (Karten in Plätze legen) */
.spielfeld{display:flex;flex-direction:column;gap:14px;min-width:0}
.plaetze,.vorrat{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.platz,.teil{appearance:none;font:inherit;color:var(--tinte);cursor:pointer;border-radius:16px;padding:6px;display:flex;flex-direction:column;align-items:stretch;gap:5px;text-align:center;touch-action:manipulation}
.platz{border:3px dashed var(--linie);background:transparent;min-height:128px}
.platz .nr{font-family:var(--f-titel);font-weight:600;font-size:1rem;color:var(--tinte-2)}
.platz.voll{border-style:solid;background:var(--flaeche)}
.platz.richtig{border-color:var(--olive);background:var(--olive-hell);cursor:default}

.antwort:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--kante)}
.antwort.richtig{border-color:var(--olive);background:var(--olive-hell)}
.antwort.falsch{border-color:var(--granat);background:var(--granat-hell);animation:wackeln .4s}
.antwort:disabled{cursor:default}
.antwort:disabled:not(.richtig){opacity:.6}
.erklaerung{display:flex;flex-direction:column;gap:10px;border-radius:16px;padding:14px 16px;background:var(--olive-hell);border:3px solid var(--olive)}

.vers-zeile{min-height:76px;border:3px dashed var(--purpur);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--purpur-hell)}

    ctx.fillStyle = "#FFF3C4"; ctx.strokeStyle = "#C98A1C"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(ax + s * (14 + p), ay); ctx.lineTo(ax - s * (10 - p), ay - 18); ctx.lineTo(ax - s * (10 - p), ay + 18); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (cv && document.body.contains(cv) && S) { update(dt); draw(); }
  requestAnimationFrame(frame);
}

/* =====================================================================
   MERKVERS UND ZIEL
   ===================================================================== */
function zeigeMerkvers() {
  buehne.className = "karte"; cv = null; ctx = null;
  const mv = SPIEL.merkvers, marken = worte.map((w, i) => ({ i, w }));
  let gelegt = [], vorrat = mischenAnders(marken.map(m => m.i)), fertigGelegt = false;
  buehne.innerHTML = `<h2>Merkvers</h2><div id="mv-pipo">${pipo("Bring die Federn in die richtige Reihenfolge. Tippe ein Wort an, dann kommt es in die Zeile.", "denkt")}</div>
    <div id="mv-feld"><div class="vers-zeile" id="zeile" aria-label="Dein Vers"></div></div><div class="vorrat-woerter" id="woerter"></div><div id="mv-meldung" aria-live="polite"></div>
    <div class="reihe zwischen"><button class="knopf zweit" id="mv-tipp" type="button">Tipp</button><button class="knopf gruen" id="mv-weiter" type="button" hidden>Zum Ziel ${ICON.pfeil}</button></div>`;
  fokusUeberschrift(); window.scrollTo({ top: 0 });
  const zeichnen = () => {
    $("#zeile").innerHTML = gelegt.map(i => `<button class="wort" type="button" data-i="${i}" aria-label="${esc(marken[i].w)} – zurücklegen">${esc(marken[i].w)}</button>`).join("");
    $("#woerter").innerHTML = vorrat.map(i => `<button class="wort" type="button" data-i="${i}">${esc(marken[i].w)}</button>`).join("");
    $("#zeile").querySelectorAll(".wort").forEach(b => b.addEventListener("click", () => { const i = Number(b.dataset.i); gelegt = gelegt.filter(x => x !== i); vorrat.push(i); Ton.klick(); zeichnen(); }));
    $("#woerter").querySelectorAll(".wort").forEach(b => b.addEventListener("click", () => { const i = Number(b.dataset.i); vorrat = vorrat.filter(x => x !== i); gelegt.push(i); Ton.klick(); zeichnen(); pruefen(); const nx = $("#woerter .wort"); if (nx) nx.focus(); }));
  };
  const geschafft = () => {
    fertigGelegt = true; Ton.fanfare(); konfetti();
    $("#mv-feld").innerHTML = `<div class="vers-fertig"><blockquote>«${esc(mv.text)}»</blockquote><span class="stelle">${ICON.buch} ${esc(mv.stelle)} · nach ${esc(mv.quelle)}</span></div>`;
    $("#woerter").innerHTML = ""; $("#mv-meldung").innerHTML = "";
    $("#mv-pipo").innerHTML = pipo("Wunderbar! Sag den Vers ein paar Mal laut – dann bleibt er in deinem Kopf.", "jubelt");
    $("#mv-tipp").hidden = true; $("#mv-weiter").hidden = false; $("#mv-weiter").focus();
  };
  const pruefen = () => {
    if (gelegt.length < worte.length) return;
    const ersterFehler = gelegt.findIndex((i, pos) => marken[i].w !== worte[pos]);
    if (ersterFehler < 0) { geschafft(); return; }
    S.mvFehler++; Ton.fast();
    const zurueck = gelegt.slice(ersterFehler); gelegt = gelegt.slice(0, ersterFehler); vorrat = vorrat.concat(zurueck);
    $("#mv-meldung").innerHTML = `<p class="meldung">${ersterFehler === 0 ? "Fang nochmal von vorne an." : `Die ersten ${ersterFehler} Wörter stimmen! Ab hier nochmal.`}</p>`; zeichnen();
  };
  $("#mv-tipp").addEventListener("click", () => {
    if (fertigGelegt) return;
    const pos = gelegt.findIndex((i, p) => marken[i].w !== worte[p]);
    if (pos >= 0) { vorrat = vorrat.concat(gelegt.slice(pos)); gelegt = gelegt.slice(0, pos); }
    const soll = worte[gelegt.length], treffer = vorrat.find(i => marken[i].w === soll); if (treffer === undefined) return;
    S.mvFehler++; vorrat = vorrat.filter(x => x !== treffer); gelegt.push(treffer); Ton.klick();
    $("#mv-meldung").innerHTML = `<p class="meldung">Das nächste Wort ist «${esc(soll)}».</p>`; zeichnen(); pruefen();
  });
  $("#mv-weiter").addEventListener("click", () => { Ton.klick(); zeigeZiel(); });
  zeichnen();
}
function zeigeZiel() {
  S.phase = "end"; progress();
  const sterne = 1 + (S.ok >= 4 ? 1 : 0) + (S.mvFehler <= 1 ? 1 : 0);
  buehne.innerHTML = `<div class="ziel-kopf"><p class="eyebrow">Ziel erreicht</p><h2>Geschafft!</h2><div class="sterne" role="img" aria-label="${sterne} von 3 Sternen">${[0, 1, 2].map(i => STERN(i < sterne)).join("")}</div></div>
    ${pipo(esc(SPIEL.abschluss), "jubelt")}
    <section class="block"><h3>Dein Sammelalbum</h3><div class="album">${TAGE.map(t => `<div class="album-tag"><span class="album-bild">${SYM[t.n]}</span><span class="album-name">Tag ${t.n}</span><span class="album-text">${esc(t.name)}</span></div>`).join("")}</div></section>
    <section class="block"><h3>Das hast du gelernt</h3><ul class="liste">${SPIEL.gelernt.map(g => `<li>${esc(g)}</li>`).join("")}</ul></section>
    <section class="kasten"><h3>Lies selbst nach</h3><p>Nimm eine Bibel und lies <strong>${esc(SPIEL.nachlesen)}</strong>. Vielleicht liest jemand mit dir zusammen.</p></section>
    <section class="kasten lila"><h3>Zum Nachdenken</h3><p>${esc(SPIEL.nachdenken)}</p></section>
    <section class="urkunde" aria-label="Urkunde"><p class="eyebrow">Urkunde</p><p class="urkunde-name" id="urkunde-name">Dein Name</p>
      <p>hat das Bibel-Lernspiel <strong>«${esc(SPIEL.titel)}»</strong> geschafft und ${sterne} ${sterne === 1 ? "Stern" : "Sterne"} gesammelt.</p>
      <label for="vorname">Schreib deinen Vornamen (er wird nicht gespeichert):</label><input id="vorname" type="text" maxlength="30" autocomplete="off" spellcheck="false"></section>
    <div class="reihe ende"><button class="knopf zweit" id="nochmal" type="button">Nochmal spielen</button></div>`;
  fokusUeberschrift(); window.scrollTo({ top: 0 });
  $("#vorname").addEventListener("input", e => { $("#urkunde-name").textContent = e.target.value.trim() || "Dein Name"; });
  $("#nochmal").addEventListener("click", () => { Ton.klick(); startWelt(); window.scrollTo({ top: 0 }); });
  Ton.fanfare(); konfetti();
}
function fokusUeberschrift() { const h = $("h1, h2", buehne); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); } }

function tonKnopf() {
  const b = $("#ton-knopf");
  b.innerHTML = Ton.an ? `${ICON.tonAn} Ton an` : `${ICON.tonAus} Ton aus`;
  b.setAttribute("aria-pressed", String(Ton.an));
}
function musikKnopf() { const b = $("#musik-knopf"); b.innerHTML = `${ICON_NOTE} Musik ${Ton.musik ? "an" : "aus"}`; b.setAttribute("aria-pressed", String(Ton.musik)); }
$("#musik-knopf").addEventListener("click", () => { Ton.musik = !Ton.musik; speicher.schreiben("bibelspatz.musik", Ton.musik); musikKnopf(); if (Ton.musik) { Ton.wecken(); Ton.musikAn(); } });
$("#ton-knopf").addEventListener("click", () => { Ton.an = !Ton.an; speicher.schreiben("bibelspatz.ton", Ton.an); tonKnopf(); if (Ton.an) { Ton.wecken(); Ton.klick(); } });

document.documentElement.lang = "de-CH";
try { if (window.self !== window.top) document.body.classList.add("eingebettet"); } catch (e) { document.body.classList.add("eingebettet"); }
$("#marke-pipo").innerHTML = PIPO_SVG;
$("#plattform-name").textContent = SPIEL.plattform;
$("#fuss").textContent = `Erzählt nach der Bibel: ${SPIEL.stelle} · Zitate nach Luther 1912, sprachlich angepasst · ${SPIEL.plattform}`;
tonKnopf(); musikKnopf(); Vorlesen.init(); startWelt();
if (location.hash === "#debug") window.__bs = { get S() { return S; }, teleport(x, y) { fl.x = x; fl.y = y; tgt.x = x; tgt.y = y; }, HOT, NEST, AUFG };
requestAnimationFrame(frame);

})();
</script>
